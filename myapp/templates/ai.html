<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Conference 2025</title>
    <link rel="stylesheet" href="styles.css"> <!-- Link to your CSS file -->
    <style>
        body {
            background: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            background: #161b22;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 195, 255, 0.2);
            text-align: center;
        }

        h1 {
            color: #00c3ff;
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .register-form {
            text-align: left;
            max-width: 400px;
            margin: auto;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #00c3ff;
            border-radius: 8px;
            background: #0d1117;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

        button {
            background: #00c3ff;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0077b6;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI WORKSHOP</h1>
        <p>Join us on March 25, 2025, for an immersive experience in the world of technology and innovation.</p>

        <h2>Register Now</h2>
        <form class="register-form">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <button type="submit">Register</button>
        </form>
    </div>

</body>
</html>
