<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}UNIVERSITY EVENTS{% endblock %}</title>
  <style>
    :root {
      --bg: #121212;
      --header: #1e1e1e;
      --accent: #00ffcc;
      --hover: #ffcc00;
      --text: #fff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      line-height: 1.6;
    }

    header, footer {
      background: var(--header);
      padding: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      font-size: 1.6rem;
      text-align: left;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--accent);
      text-decoration: none;
      font-weight: bold;
      position: relative;
      transition: 0.3s;
    }

    nav a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 100%;
      height: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.3s ease;
    }

    nav a:hover {
      color: var(--hover);
    }

    nav a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .auth-links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .auth-links a, .auth-links button {
      background: var(--accent);
      color: #000;
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.3s;
    }

    .auth-links a:hover,
    .auth-links button:hover {
      background: var(--hover);
    }

    main {
      padding: 30px 20px;
    }

    footer {
      font-size: 0.85rem;
      margin-top: 30px;
    }

    @media (max-width: 768px) {
      header {
        flex-direction: column;
        align-items: flex-start;
      }

      nav ul {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>UNIVERSITY EVENTS</h1>

    <nav>
      <ul>
        <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
        <li><a href="{% url 'events' %}">Events</a></li>
        <li><a href="{% url 'sponsors' %}">Sponsors</a></li>
        <li><a href="{% url 'contact' %}">Contact</a></li>
      </ul>
    </nav>

    <div class="auth-links">
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit">Logout</button>
        </form>
      {% else %}
        <a href="{% url 'registration' %}">Register</a>
      {% endif %}
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>END</p>
  </footer>
</body>
</html>
